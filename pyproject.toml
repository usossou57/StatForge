[project]
name = "statistical-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyreadstat>=1.3.6",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
statistical-ai = "statistical_ai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
