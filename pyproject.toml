[project]
name = "statistical-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pyreadstat>=1.3.6",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.3",
    "streamlit>=1.64.0",
]

[project.scripts]
statistical-ai = "statistical_ai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "types-greenlet>=3.5.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
