name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: astral-sh/setup-uv@v3
    
    - name: Sync dependencies
      run: uv sync --all-extras --dev
    
    - name: Run ruff check
      run: uv run ruff check .
    
    - name: Run pytest
      run: uv run pytest
